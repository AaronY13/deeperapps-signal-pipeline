name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (catch syntax errors)
        run: python -m py_compile ingest.py sources.py

      - name: Import check (catch missing deps / import errors)
        run: python -c "import ingest, sources"
