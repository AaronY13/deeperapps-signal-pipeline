name: Daily Ingest

# Runs the barebones ingestion script on a schedule so a broken source or a
# code bug surfaces as a failed Action run instead of silently going stale.
# No storage/DB layer yet (that's Phase 2/4 per the project brief), so this
# just uploads the raw output as a build artifact for now.

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: python ingest.py

      - name: Upload raw items
        uses: actions/upload-artifact@v4
        with:
          name: raw-items-${{ github.run_id }}
          path: data/raw_items.json
          retention-days: 14
